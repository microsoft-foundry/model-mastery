<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">From Model Selection to Agent Optimization</title>
  <desc id="desc">A stylized hill climb from model selection through measurement to agent optimization.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#32145f"/>
      <stop offset="48%" stop-color="#1863b4"/>
      <stop offset="100%" stop-color="#13a884"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#54d6b2" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#081a33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1040" cy="70" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="1120" cy="270" r="170" fill="#ffffff" opacity="0.05"/>

  <path d="M0 315 C180 280 285 300 410 245 C535 190 625 225 750 165 C870 108 1005 115 1200 35 L1200 360 L0 360 Z"
        fill="url(#hill)" opacity="0.72"/>
  <path d="M65 300 C220 263 315 278 425 228 C555 168 638 205 758 148 C890 86 1010 103 1135 53"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14" opacity="0.88"/>

  <g fill="#ffffff" filter="url(#shadow)">
    <circle cx="90" cy="294" r="12"/>
    <circle cx="430" cy="226" r="12"/>
    <circle cx="760" cy="147" r="12"/>
    <circle cx="1115" cy="61" r="15"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="72" font-size="18" font-weight="600" letter-spacing="2.2" opacity="0.9">MICROSOFT FOUNDRY WORKSHOP</text>
    <text x="64" y="118" font-size="37" font-weight="700">From Model Selection</text>
    <text x="64" y="160" font-size="37" font-weight="700">to Agent Optimization</text>
    <text x="64" y="196" font-size="18" opacity="0.88">Measure. Change one lever. Measure again.</text>

    <text x="62" y="336" font-size="15" font-weight="600">SELECT</text>
    <text x="380" y="274" font-size="15" font-weight="600">BASELINE</text>
    <text x="718" y="196" font-size="15" font-weight="600">ROUTE</text>
    <text x="1040" y="105" font-size="15" font-weight="600">OPTIMIZE</text>
  </g>
</svg>
